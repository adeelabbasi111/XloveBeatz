<header class="site-header">
    <!-- Logo -->
    <a href="{{ url_for('public.home') }}" class="logo">
        <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Logo" class="logo-icon" style="background: transparent; object-fit: cover; box-shadow: 0 4px 15px rgba(194, 164, 90, 0.2);">
        <span class="logo-text">XLOVEBEATS</span>
    </a>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
        <div class="nav-dropdown">
            <button class="nav-link {% if active_page in ['player', 'beat-packs', 'vocal-presets'] %}active{% endif %}">
                <i class="fas fa-layer-group"></i>
                <span>Products</span>
                <i class="fas fa-chevron-down dropdown-icon" style="font-size: 0.75rem; margin-left: 2px;"></i>
            </button>
            <div class="dropdown-menu">
                <a href="{{ url_for('public.player_page') }}" class="dropdown-item {% if active_page == 'player' %}active{% endif %}">
                    <i class="fas fa-music"></i>
                    <div class="dropdown-text">
                        <span class="title">Beats</span>
                        <span class="desc">Individual licenses</span>
                    </div>
                </a>
                <a href="{{ url_for('public.beat_packs_page') }}" class="dropdown-item {% if active_page == 'beat-packs' %}active{% endif %}">
                    <i class="fas fa-box"></i>
                    <div class="dropdown-text">
                        <span class="title">Packs</span>
                        <span class="desc">Curated collections</span>
                    </div>
                </a>
                <a href="{{ url_for('public.vocal_presets_page') }}" class="dropdown-item {% if active_page == 'vocal-presets' %}active{% endif %}">
                    <i class="fas fa-microphone"></i>
                    <div class="dropdown-text">
                        <span class="title">Presets</span>
                        <span class="desc">Studio vocal chains</span>
                    </div>
                </a>
            </div>
        </div>
        <a href="{{ url_for('public.about_page') }}" class="nav-link {% if active_page == 'about' %}active{% endif %}">
            <i class="fas fa-info-circle"></i>
            <span>About</span>
        </a>
        <a href="/dashboard" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">
            <i class="fas fa-chart-line"></i>
            <span>Dashboard</span>
        </a>

        <div class="nav-divider"></div>

        <button class="nav-link nav-action" id="openCartBtn">
            <i class="fas fa-shopping-cart"></i>
            <span>Cart</span>
            <span class="nav-badge" id="cartCount">3</span>
        </button>

        <button class="nav-link nav-action logged-in" id="accountBtn">
            <i class="fas fa-user"></i>
            <span>Account</span>
        </button>
    </nav>
</header>
